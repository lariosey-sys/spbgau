services:
  postgres:
    image: ${POSTGRES_IMAGE}
    container_name: pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_DEFAULT}
      TZ: ${TZ}
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB_DEFAULT}"]
      interval: 5s
      timeout: 5s
      retries: 20

  nocodb:
    image: ${NOCODB_IMAGE}
    container_name: nocodb
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
      PORT: ${NOCODB_PORT}
      NC_DB: "pg://postgres:5432?u=${POSTGRES_USER}&p=${POSTGRES_PASSWORD}&d=${NOCODB_DB_NAME}"
      NC_PUBLIC_URL: "http://localhost:${NOCODB_PORT}"
    volumes:
      - ./nocodb:/usr/app/data
    ports:
      - "${NOCODB_PORT}:${NOCODB_PORT}"

  mosquitto:
    image: ${MOSQUITTO_IMAGE}
    container_name: mosquitto
    restart: unless-stopped
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    ports:
      - "${MQTT_PORT}:1883"
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -t test -m healthcheck -p 1883 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  dashboard:
    build: ./dashboard
    container_name: dashboard
    volumes:
      - ./dashboard/data:/data
    restart: unless-stopped
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 1883
    ports:
      - "80:8081"
    depends_on:
      - mosquitto
